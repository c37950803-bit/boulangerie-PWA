<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241b14"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fond écran terminal rétro -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Ligne de scanlines terminal décorative -->
  <path d="M48 90h416M48 130h416M48 170h416M48 210h416M48 250h416M48 290h416M48 330h416M48 370h416M48 410h416" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="2"/>
  
  <!-- Pain artisanal doré (Croissant / Baguette / Miche) -->
  <g filter="url(#amberGlow)">
    <!-- Miche de pain -->
    <path d="M120 330 C110 210 210 160 256 160 C302 160 402 210 392 330 C392 365 350 375 256 375 C162 375 120 365 120 330 Z" fill="url(#crustGrad)"/>
    <!-- Incisions de boulanger (grignes) -->
    <path d="M185 220 Q205 285 225 330" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M245 200 Q256 275 267 335" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M305 220 Q305 285 295 330" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Épis de blé stylisés -->
    <path d="M256 110 L256 150" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="100" r="8" fill="#fef08a"/>
    <circle cx="238" cy="120" r="7" fill="#fef08a"/>
    <circle cx="274" cy="120" r="7" fill="#fef08a"/>
    <circle cx="240" cy="138" r="6" fill="#fef08a"/>
    <circle cx="272" cy="138" r="6" fill="#fef08a"/>
  </g>
  
  <!-- Invite de commande terminal ">_" -->
  <text x="70" y="445" font-family="'Courier New', monospace" font-weight="900" font-size="44" fill="#fbbf24" letter-spacing="2">> BOULANGERIE_</text>
</svg>
